
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#031b13"/>
      <stop offset="55%" stop-color="#075b36"/>
      <stop offset="100%" stop-color="#012b1c"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8ff72"/>
      <stop offset="50%" stop-color="#39e879"/>
      <stop offset="100%" stop-color="#00a85a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="230" r="175" fill="#18d875" opacity=".07"/>
  <circle cx="256" cy="230" r="130" fill="none" stroke="#62f59b" stroke-width="2" opacity=".16"/>

  <path d="M125 160 Q256 65 387 160" fill="none"
        stroke="#65f5a0" stroke-width="5" opacity=".35"/>

  <text x="256" y="242" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="91"
        font-weight="900" letter-spacing="-5"
        fill="url(#green)" filter="url(#glow)">PED</text>

  <text x="256" y="320" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="67"
        font-weight="800" letter-spacing="1"
        fill="#ffffff">TALK</text>

  <path d="M150 350 H362" stroke="#57ef91" stroke-width="4"
        stroke-linecap="round" opacity=".8"/>

  <text x="256" y="390" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="19"
        font-weight="600" letter-spacing="5"
        fill="#b8f5d0">PODCAST</text>

  <circle cx="105" cy="110" r="5" fill="#8cffb2"/>
  <circle cx="407" cy="395" r="6" fill="#8cffb2"/>
</svg>
